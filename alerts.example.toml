# Alerting for a rustock node.
#
#   rustock --alerts-config /etc/rustock/alerts.toml ...
#
# One file, one mail transport, one section per kind of alert. Adding a kind
# means adding a section here, not a second file with a second credential that
# drifts out of date.
#
# Entirely optional, and entirely an observer. Nothing here is wired into
# execution or sync, so it cannot affect consensus or slow block processing.
# If the mail server is unreachable the node does not notice.

[alerts.email]
# Until this is true, alerts are logged and nothing is sent.
enabled = false

# Secrets do NOT belong in this file. Put them in a root-owned file with mode
# 0600 and refer to them below as ${NAME}; they are resolved at startup and
# never logged. The node refuses to start the watcher if this file is readable
# by group or others.
#
#   /etc/rustock/alerts.env
#     SMTP_USER=...
#     SMTP_PASSWORD=...
#
# env_file = "/etc/rustock/alerts.env"

to = ["you@example.com"]
from = "rustock-node@example.com"

smtp_host = "smtp.example.com"
smtp_port = 587

# username = "${SMTP_USER}"
# password = "${SMTP_PASSWORD}"

# none | starttls | implicit
tls = "starttls"

# Prefix subjects with "[rustock peg-out] " so they filter easily.
subject_prefix_enabled = true

# ── Node health alarms ───────────────────────────────────────────────────────
#
# Three conditions, each of which means the node is not doing its job:
#
#   1. stalled      -- the executed head has not moved
#   2. behind       -- the best peer is more than `block_gap` blocks ahead
#   3. ahead        -- this node is more than `block_gap` ahead of EVERY peer
#
# Condition 3 is not a humblebrag. Being ahead of the whole network means
# either that this node is following a chain the network rejected, or that all
# of its peers are stale and it is effectively blind. Both look like health
# from inside.
#
# Mail goes through the [alerts.email] transport above: one
# configuration, one credential.

[alerts.pegout]
enabled = true

# How often to look for newly executed blocks.
poll_interval_secs = 5

# Where to start. Omit to begin at the node's current executed head, which is
# almost always what you want — otherwise the first sweep replays the chain and
# alerts on history.
# start_block = 9200000

# Alert when a single peg-out request exceeds this many BTC.
pegout_alert_btc = 100.0

# Alert when any single non-change output of a peg-out Bitcoin transaction
# awaiting signature exceeds this many BTC.
output_alert_btc = 100.0

# Alert when the total value of peg-outs in transit exceeds this many BTC.
# "In transit" means built by the Bridge but not yet confirmed, so not yet
# handed to the signers.
in_transit_alert_btc = 200.0

# How often to log the total value of peg-outs in transit, in seconds.
# A report, not an alert: it fires whatever the total is, as long as it is
# non-zero, so money moving is visible rather than only threshold breaches.
# Silent when nothing is in transit. 0 disables it.
in_transit_report_secs = 600

# Confirmations a peg-out needs before it stops counting as in transit.
# Mainnet uses 4,000.
confirmations = 4000

# scriptPubKeys (hex) that are federation change rather than a transfer to an
# end user. Outputs paying these are excluded from the per-output check and from
# the in-transit total.
#
# Leave empty and EVERY output is treated as a user output. That over-alerts
# whenever the federation's change exceeds the threshold, but it can never hide
# a real transfer — the safe direction. Fill it in to silence change precisely.
federation_change_scripts = [
  # "a914...87",
]

[alerts.node_health]
enabled = false

# How often to take a reading. Must not exceed for_secs, or a condition could
# hold for its whole window between two readings and never be seen -- the
# config is rejected if it does.
poll_interval_secs = 30

# Blocks of difference before "behind" or "ahead" is true at all. The test is
# strictly greater, so a steady gap of exactly this many does not alert.
block_gap = 10

# How long a condition must hold CONTINUOUSLY before it is reported. Every one
# of these is momentarily true in normal operation -- a reorg stalls execution
# for seconds, a peer announces a block before this node has it -- so any
# reading that clears the condition restarts the timer.
for_secs = 600

# How long that alarm stays quiet after firing. NOT reset by recovery: a node
# that flaps is exactly the case where per-occurrence mail is useless, because
# the first message already said what is wrong.
#
# The three alarms are independent; a cooldown on one says nothing about the
# others.
cooldown_secs = 86400
