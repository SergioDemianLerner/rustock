[workspace]
members = [
    "crates/core",
    "crates/cli",
    "crates/storage",
    "crates/networking",
    "crates/sync",
    "crates/rpc",
    "crates/trie",
    "crates/execution",
]
resolver = "2"

[workspace.dependencies]
alloy-primitives = { version = "1.5.4", features = ["serde", "rlp"] }
alloy-rlp = { version = "0.3.13", features = ["derive"] }
anyhow = "1.0.104"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
thiserror = "2.0.18"
rand = "0.8.6"
tempfile = "3.25.0"
lru = "0.18.4"
sha3 = "0.10.8"
sha2 = "0.10.9"
hex = "0.4.3"
k256 = "0.13.4"
async-trait = "0.1"
bitcoin = "0.32.8"
ripemd = "0.1"
futures = "0.3.31"
rocksdb = "0.25.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
