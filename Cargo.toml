[workspace]
members = [
    "crates/core",
    "crates/cli",
    "crates/storage",
    "crates/networking",
    "crates/sync",
    "crates/rpc",
    "crates/trie",
    "crates/flatdb",
    "crates/execution",
    "crates/alerts",
]
resolver = "2"

# Lints applied across every crate. Both entries below are style lints whose
# remedy costs more than the lint is worth here.
#
# `too_many_arguments`: the functions that trip it are consensus entry points
# whose arguments mirror rskj's. Bundling them into structs to satisfy an
# arbitrary threshold of 7 would obscure that correspondence and risk
# reordering a parameter during the refactor, for no behavioural gain.
#
# `type_complexity`: the types that trip it are trie and snapshot callbacks
# whose shape is the documentation. Hiding them behind aliases moves the
# information rather than removing it.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[workspace.dependencies]
alloy-primitives = { version = "1.5.4", features = ["serde", "rlp"] }
alloy-rlp = { version = "0.3.13", features = ["derive"] }
anyhow = "1.0.104"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "time"] }
# `local-offset` lets the node read the machine's UTC offset. The `time` crate
# only allows that while the process is single-threaded, which is why the
# offset is resolved in `main` before the tokio runtime is built.
time = { version = "0.3", features = ["local-offset", "macros", "formatting"] }
thiserror = "2.0.18"
rand = "0.8.6"
tempfile = "3.25.0"
lru = "0.18.4"
sha3 = "0.10.8"
sha2 = "0.10.9"
hex = "0.4.3"
k256 = "0.13.4"
# Pieter Wuille's libsecp256k1, through the rust-bitcoin bindings, vendored
# as C sources. Used for signature recovery, which it does 4.3x faster than
# the pure-Rust k256 -- measured on real mainnet transactions by
# `cargo run --release --example validation_cost`.
#
# Pinned to the version `revm-precompile` resolves to, deliberately and not
# to the one `bitcoin` pulls in. Two copies of this library are in the
# binary either way -- bitcoin wants 0.29, revm wants 0.31 -- so the choice
# does not reduce the count. It decides something else: recovering a
# transaction's sender and running the EVM's `ecrecover` precompile are two
# places that judge the same question, which signatures are valid, and they
# should not be able to answer it differently because they link different
# versions of the same C library.
secp256k1 = { version = "0.31.1", features = ["recovery"] }
async-trait = "0.1"
bitcoin = "0.32.8"
ripemd = "0.1"
futures = "0.3.31"
rocksdb = "0.25.0"
libc = "0.2"

[profile.dev]
# Line tables only: backtraces keep file and line numbers, but the type and
# variable DWARF is dropped. That DWARF is the bulk of target/debug, which had
# grown to tens of GB and filled the root filesystem. Note that `debug = 1`
# does NOT do this -- it means `limited`, which still emits type information.
debug = "line-tables-only"

# The RocksDB C++ objects are compiled with -g because cargo sets DEBUG=true
# for build scripts whenever debug info is on, and the cc crate honours it.
# We never step through RocksDB's own source, so this buys nothing.
[profile.dev.package.librocksdb-sys]
debug = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
