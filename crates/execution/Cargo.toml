[package]
name = "rustock-execution"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
rustock-core = { version = "0.1.0", path = "../core" }
rustock-trie = { version = "0.1.0", path = "../trie" }
rustock-storage = { version = "0.1.0", path = "../storage" }
revm = { version = "36", default-features = false, features = ["std", "secp256k1", "optional_eip3541"] }
alloy-primitives = { workspace = true }
alloy-rlp = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha3 = { workspace = true }
sha2 = { workspace = true }
ripemd = { workspace = true }
k256 = { workspace = true, features = ["arithmetic"] }
bitcoin = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
hex = { workspace = true }
