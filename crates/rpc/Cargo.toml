[package]
name = "rustock-rpc"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
alloy-primitives = { workspace = true }
alloy-rlp = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = "0.8"
rustock-core = { version = "0.1.0", path = "../core" }
rustock-execution = { version = "0.1.0", path = "../execution" }
rustock-networking = { version = "0.1.0", path = "../networking" }
rustock-storage = { version = "0.1.0", path = "../storage" }
rustock-trie = { version = "0.1.0", path = "../trie" }
hex = { workspace = true }
serde = { workspace = true }
serde_json = "1"
sha3 = { workspace = true }
tokio = { workspace = true }
tower-http = { version = "0.6", features = ["cors"] }
tracing = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
# Only the tests need to sign: the `trace_*` renderer recovers a sender from
# every transaction it renders, so an end-to-end test has to produce a
# signature a real node would accept rather than a placeholder.
k256 = { workspace = true, features = ["arithmetic", "ecdsa"] }
sha3 = { workspace = true }
tempfile = { workspace = true }
