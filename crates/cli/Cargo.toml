[package]
name = "rustock-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lints]
workspace = true

[dependencies]
alloy-primitives = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { version = "4.5.58", features = ["derive"] }
serde = { workspace = true }
toml = "0.8.19"
k256 = { workspace = true }
rustock-core = { version = "0.1.0", path = "../core" }
rustock-execution = { version = "0.1.0", path = "../execution" }
rustock-networking = { version = "0.1.0", path = "../networking" }
rustock-storage = { version = "0.1.0", path = "../storage" }
rustock-flatdb = { version = "0.1.0", path = "../flatdb" }
rustock-alerts = { version = "0.1.0", path = "../alerts" }
rustock-rpc = { version = "0.1.0", path = "../rpc" }
rustock-sync = { version = "0.1.0", path = "../sync" }
rustock-trie = { version = "0.1.0", path = "../trie" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
time = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
tracing-appender = "0.2.4"
rocksdb = { workspace = true }
libc = { workspace = true }
alloy-rlp = { workspace = true }
flate2 = "1"

[features]
# Enable outgoing email for peg-out alerts (pulls in a TLS stack).
smtp = ["rustock-alerts/smtp"]

[dev-dependencies]
tempfile = { workspace = true }
serde_json = "1"
# For the examples that decode a peg-in's bitcoin transaction straight out of
# the call data, without executing the block. `validation_cost` also reaches
# through it for `secp256k1`, the rust-bitcoin bindings to the C
# libsecp256k1, to time sender recovery against the pure-Rust `k256` the
# node uses today.
bitcoin = { workspace = true }
# `validation_cost` hashes a recovered public key the way the node does.
sha3 = { workspace = true }
