[package]
name = "rustock-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lints]
workspace = true

[dependencies]
# Only for the chain-event broadcast channel: the sync service publishes and
# the RPC layer's subscriptions consume, and neither crate depends on the
# other, so the type has to live where both can see it.
tokio = { workspace = true }
alloy-primitives = { workspace = true }
alloy-rlp = { workspace = true }
anyhow = { workspace = true }
bitcoin = { workspace = true }
hex = { workspace = true }
hex-literal = "0.4.1"
serde_json = "1"
secp256k1 = { workspace = true }
serde = { workspace = true }
ripemd = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
rustock-trie = { version = "0.1.0", path = "../trie" }
thiserror = { workspace = true }

[dev-dependencies]
# The tests sign with k256 and recover with libsecp256k1, which makes them
# a cross-check between two independent implementations rather than a
# round trip through one. Production code no longer uses k256 at all.
k256 = { workspace = true, features = ["ecdsa"] }
