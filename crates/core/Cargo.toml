[package]
name = "rustock-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
# Only for the chain-event broadcast channel: the sync service publishes and
# the RPC layer's subscriptions consume, and neither crate depends on the
# other, so the type has to live where both can see it.
tokio = { workspace = true }
alloy-primitives = { workspace = true }
alloy-rlp = { workspace = true }
anyhow = { workspace = true }
bitcoin = { workspace = true }
hex = { workspace = true }
hex-literal = "0.4.1"
k256 = { workspace = true, features = ["ecdsa"] }
serde = { workspace = true }
ripemd = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
rustock-trie = { version = "0.1.0", path = "../trie" }
thiserror = { workspace = true }
